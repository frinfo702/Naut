included:
  - macos/Sources
  - macos/Tests

# The codebase's style: short local names, long lines, big editor files,
# and test harnesses that crash on purpose. `let _ =` is how a SwiftUI
# body reads a value without using it.
disabled_rules:
  - identifier_name
  - type_name
  - line_length
  - file_length
  - type_body_length
  - function_body_length
  - function_parameter_count
  - cyclomatic_complexity
  - nesting
  - large_tuple
  - trailing_comma
  - force_try
  - force_cast
  - todo
  - redundant_discardable_let
