name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Zig core on Linux: proves libnaut doesn't depend on macOS.
  zig:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Format
        run: nix develop .#ci --command zig fmt --check .
      - name: Test
        run: nix develop .#ci --command zig build test -Demit-macos-app=false --summary all

  # libnaut, the xcframework, NautKit and the app bundle, then Swift tests.
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Test
        run: nix develop .#ci --command zig build test --summary all
      - name: Build app
        run: nix develop .#ci --command zig build -Doptimize=fast
      - name: Swift tests
        run: swift test --package-path macos

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check
      - run: terraform init -backend=false -input=false
      - run: terraform validate
